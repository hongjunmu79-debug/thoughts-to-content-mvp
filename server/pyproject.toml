[project]
name = "thoughts-to-content-server"
version = "0.1.0"
description = "API for the Thoughts to Content voice-preserving MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "python-dotenv>=1.0.1,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

