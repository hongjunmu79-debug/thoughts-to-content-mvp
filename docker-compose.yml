services:
  api:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/thoughts.db
      WEB_ORIGINS: http://localhost:5173,http://localhost:4173
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"

